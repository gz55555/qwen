; Ollama inference server — managed by setup.sh (model bootstrap repo). Loopback only:
; the central server reaches it through an SSH tunnel, never directly.
[program:ollama]
command=@OLLAMA_BIN@ serve
environment=OLLAMA_HOST="127.0.0.1:11434",HOME="/root",@OLLAMA_ENV@
autostart=true
autorestart=true
startsecs=5
stopwaitsecs=30
stdout_logfile=/var/log/ollama.log
stdout_logfile_maxbytes=50MB
stdout_logfile_backups=3
redirect_stderr=true
