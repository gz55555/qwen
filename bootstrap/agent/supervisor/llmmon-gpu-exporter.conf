; llmmon Layer 1 — GPU + container exporter (127.0.0.1:9835)
[program:llmmon-gpu-exporter]
command=/opt/llmmon-agent/scripts/run-gpu-exporter.sh
user=llmmon
directory=/opt/llmmon-agent
autostart=true
autorestart=true
startsecs=5
startretries=10
stopsignal=TERM
stopwaitsecs=10
priority=900
stdout_logfile=/var/log/llmmon/gpu-exporter.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=3
redirect_stderr=true
