; llmmon Layer 1 — node_exporter, CONTAINER scope only (127.0.0.1:9100)
[program:llmmon-node-exporter]
command=/opt/llmmon-agent/scripts/run-node-exporter.sh
user=llmmon
directory=/opt/llmmon-agent
autostart=true
autorestart=true
startsecs=5
startretries=10
stopsignal=TERM
stopwaitsecs=10
priority=900
stdout_logfile=/var/log/llmmon/node-exporter.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=3
redirect_stderr=true
