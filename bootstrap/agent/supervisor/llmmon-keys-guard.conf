; llmmon — re-adds managed SSH key lines if authorized_keys is rewritten (every 30 s). Root: owns /root/.ssh.
[program:llmmon-keys-guard]
command=/opt/llmmon-agent/scripts/keys-guard.sh --loop
user=root
directory=/opt/llmmon-agent
autostart=true
autorestart=true
startsecs=2
startretries=10
stopsignal=TERM
stopwaitsecs=5
priority=900
stdout_logfile=/var/log/llmmon/keys-guard.log
stdout_logfile_maxbytes=1MB
stdout_logfile_backups=1
redirect_stderr=true
